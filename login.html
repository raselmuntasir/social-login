<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top One - Admin Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Inter', 'Baloo Da 2', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            height: 100vh;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative">
    <!-- Animated background elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-600/20 rounded-full blur-[120px] animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[120px] animate-pulse delay-700"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo Section -->
        <div class="text-center mb-8 animate-float">
            <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[2rem] flex items-center justify-center mx-auto mb-4 shadow-2xl shadow-indigo-500/40 rotate-12">
                <i class="fas fa-bolt text-white text-3xl"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter">Top One <span class="gradient-text">Admin</span></h1>
            <p class="text-slate-400 text-sm font-medium mt-2 uppercase tracking-widest">Management Portal</p>
        </div>

        <!-- Login Card -->
        <div id="auth-card" class="glass-card rounded-[2.5rem] p-8 md:p-10 relative overflow-hidden transition-all duration-500">
            <!-- Tabs -->
            <div class="flex gap-1 bg-white/5 p-1 rounded-2xl mb-8">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-3 text-sm font-black rounded-xl transition-all bg-white/10 text-white shadow-xl">LOG IN</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-3 text-sm font-black rounded-xl transition-all text-slate-400 hover:text-slate-200">REGISTER</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Email Address</label>
                    <div class="relative group">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                        <input type="email" id="login-email" required placeholder="admin@example.com" 
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 transition-all font-medium">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Password</label>
                    <div class="relative group">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                        <input type="password" id="login-password" required placeholder="••••••••" 
                            class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500/50 transition-all font-medium">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-600/20 transition-all active:scale-95 flex items-center justify-center gap-3">
                    <span>ENTER DASHBOARD</span>
                    <i class="fas fa-arrow-right text-xs opacity-50"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden space-y-5 animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="Your Full Name" 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Email Address</label>
                    <input type="email" id="reg-email" required placeholder="admin@example.com" 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Assign Password</label>
                    <input type="password" id="reg-password" required placeholder="••••••••" 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all font-medium">
                </div>
                <button type="submit" class="w-full bg-white/10 hover:bg-white/20 text-white font-black py-5 rounded-2xl border border-white/10 transition-all active:scale-95 uppercase tracking-widest text-sm">
                    CREATE ACCOUNT
                </button>
            </form>

            <div id="error-msg" class="hidden mt-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-bold text-center"></div>
        </div>

        <p class="text-center text-slate-500 text-[10px] font-black uppercase tracking-[0.2em] mt-8">Secure Environment v2.0</p>
    </div>

    <!-- UI Helpers -->
    <script src="js/ui_utils.js"></script>
    <script>
        // Supabase Initialization (replace with your config if different)
        const SUPABASE_URL = 'https://cmdculyngchoxcnzaypt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZGN1bHluZ2Nob3hjbnpheXB0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MjU3NDQsImV4cCI6MjA5MjAwMTc0NH0.gCks8rNvyQ9hV8vR3oVkrEN5WaLGuN0aja6SK-gY7g0';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('bg-white/10', 'text-white', 'shadow-xl');
                tabLogin.classList.remove('text-slate-400');
                tabRegister.classList.remove('bg-white/10', 'text-white', 'shadow-xl');
                tabRegister.classList.add('text-slate-400');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('bg-white/10', 'text-white', 'shadow-xl');
                tabRegister.classList.remove('text-slate-400');
                tabLogin.classList.remove('bg-white/10', 'text-white', 'shadow-xl');
                tabLogin.classList.add('text-slate-400');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.innerText = '⚠️ ' + msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        // Login Handler
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                // In a real app, use Supabase Auth. For now, simple check against admins table.
                const { data, error } = await _supabase
                    .from('admins')
                    .select('*, roles(name)')
                    .eq('email', email)
                    .single();

                if (error || !data) {
                    showError('Account not found or access denied.');
                } else {
                    // Modern Hashed Password Check
                    const hashedInput = await window.UI.hashPassword(password);
                    if (hashedInput === data.password) {
                        const profile = { ...data, role_name: data.roles?.name || 'n/a' };
                        sessionStorage.setItem('admin_profile', JSON.stringify(profile));
                        sessionStorage.setItem('admin_auth', 'true');
                        window.location.href = 'admin.html';
                    } else {
                        showError('Invalid credentials. Please try again.');
                    }
                }
            } catch (err) {
                showError('Connection error. Check your internet.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        };

        // Register Handler
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const hashedPassword = await window.UI.hashPassword(password);
                const { error } = await _supabase
                    .from('admins')
                    .insert([{ 
                        name, 
                        email, 
                        password: hashedPassword,
                        role_id: 14, // Default to Sub Admin
                        status: 'pending' 
                    }]);

                if (error) throw error;
                
                alert('Registration successful! Please login with your email.');
                switchTab('login');
            } catch (err) {
                showError('Registration failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'CREATE ACCOUNT';
            }
        };

        // Redirect if already logged in
        if (sessionStorage.getItem('admin_auth') === 'true') {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
